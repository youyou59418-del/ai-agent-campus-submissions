[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-planning-agent"
version = "0.1.0"
description = "Budget-aware content campaign planning with persistent steps and model-driven replanning"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
content-planner = "content_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
