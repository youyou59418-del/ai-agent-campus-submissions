[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-qa-agent"
version = "0.1.0"
description = "Evidence-checked enterprise FAQ agent with conflict handling and extractive answers"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
enterprise-qa = "enterprise_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
