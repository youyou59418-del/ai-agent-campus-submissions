[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "short-video-script-agent"
version = "0.1.0"
description = "Evidence-bound short-video scripts with checked revisions and duration estimates"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
short-video-script = "video_script.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
